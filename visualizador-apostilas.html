<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/image/colegio-tancredo-almeida-neves_icon 32x32.svg" type="image/svg+xml">
    <title>Visualizador de Apostilas | Colégio Tancredo</title>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- CSS externo -->
    <link rel="stylesheet" href="css/visualizador-pdf.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/scroll-helper.js"></script>
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <button onclick="fechar()" class="close-btn" title="Fechar"><i class="fas fa-times"></i></button>
        </div>
        <div class="toolbar-center">
            <button onclick="prevPage()" title="Página anterior"><i class="fas fa-chevron-left"></i></button>
            <span>Página <input type="number" id="page-num" value="1" min="1"> de <span id="page-count">?</span></span>
            <button onclick="nextPage()" title="Próxima página"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="toolbar-right">
            <button onclick="fitToWidth()" title="Ajustar à largura"><i class="fas fa-arrows-alt-h"></i></button>
            <button onclick="fitToHeight()" title="Ajustar à altura"><i class="fas fa-arrows-alt-v"></i></button>
            <button onclick="actualSize()" title="Tamanho real"><i class="fas fa-expand-arrows-alt"></i></button>
            <button onclick="zoomOut()" title="Diminuir zoom"><i class="fas fa-search-minus"></i></button>
            <span id="zoom-level">100%</span>
            <button onclick="rotatePage()" title="Rotacionar página"><i class="fas fa-rotate-right"></i></button>
            <button id="play-pause-btn" onclick="toggleAutoPlay()" title="Apresentação automática"><i class="fas fa-play"></i></button>
            <button onclick="toggleFullscreen()" title="Tela cheia"><i class="fas fa-expand"></i></button>
            <button onclick="downloadPDF()" title="Baixar PDF"><i class="fas fa-download"></i></button>
        </div>
    </div>
    <div id="viewer">
        <div id="pdf-container"></div>
    </div>

    <script>
        (function () {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            const urlParams = new URLSearchParams(window.location.search);
            const arquivo = urlParams.get('file');
            const pasta = urlParams.get('pasta') || 'apostilas';
            const viewer = document.getElementById('viewer');
            const container = document.getElementById('pdf-container');
            const pageInput = document.getElementById('page-num');
            const pageCountLabel = document.getElementById('page-count');
            const zoomLabel = document.getElementById('zoom-level');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const fullscreenBtn = document.querySelector('button[onclick="toggleFullscreen()"]');

            if (!arquivo) {
                viewer.innerHTML = `
                    <div class="viewer-empty-state">
                        <i class="fas fa-file-pdf viewer-empty-state__icon"></i>
                        <h2>Nenhuma apostila especificada</h2>
                        <p>Por favor, acesse o acervo para selecionar uma apostila.</p>
                        <button onclick="window.location.href='acervo.html'" class="viewer-empty-state__button">
                            Ir para Acervo
                        </button>
                    </div>
                `;
                return;
            }

            const cacheKey = Date.now();
            const pdfPath = `${pasta}/${encodeURIComponent(arquivo)}?t=${cacheKey}`;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            let pdfDoc = null;
            let pageNum = 1;
            let pageCount = 0;
            let scale = 1;
            let fitScale = 1;
            let rotation = 0;
            let autoPlayInterval = null;
            let autoPlayActive = false;
            let renderTask = null;
            let pendingPage = null;
            let userAdjustedZoom = false;

            container.appendChild(canvas);

            function atualizarZoomLabel() {
                zoomLabel.textContent = `${Math.round(scale * 100)}%`;
            }

            function atualizarPaginaLabel() {
                pageInput.value = pageNum;
                pageInput.max = pageCount || 1;
                pageCountLabel.textContent = pageCount || '?';
            }

            function ajustarEscalaInicial() {
                if (!pdfDoc) {
                    return Promise.resolve();
                }

                return pdfDoc.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 1, rotation });
                    const availableWidth = Math.max(viewer.clientWidth - 48, 260);
                    const availableHeight = Math.max(viewer.clientHeight - 48, 180);
                    const scaleX = availableWidth / viewport.width;
                    const scaleY = availableHeight / viewport.height;

                    fitScale = Math.min(scaleX, scaleY, 3);

                    if (fitScale < 0.3) {
                        fitScale = 0.3;
                    }

                    if (!userAdjustedZoom || scale < fitScale) {
                        scale = fitScale;
                    }

                    atualizarZoomLabel();
                });
            }

            function renderPage(num) {
                if (!pdfDoc) {
                    return;
                }

                if (renderTask) {
                    pendingPage = num;
                    renderTask.cancel();
                    return;
                }

                container.style.opacity = '0.5';
                atualizarPaginaLabel();

                pdfDoc.getPage(num).then(page => {
                    const viewport = page.getViewport({ scale, rotation });
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.width = `${viewport.width}px`;
                    canvas.style.height = `${viewport.height}px`;

                    renderTask = page.render({ canvasContext: ctx, viewport });
                    return renderTask.promise;
                }).catch(err => {
                    if (err && err.name === 'RenderingCancelledException') {
                        return;
                    }

                    throw err;
                }).then(() => {
                    container.style.opacity = '1';
                    atualizarPaginaLabel();
                    atualizarZoomLabel();
                }).catch(err => {
                    viewer.innerHTML = `<div class="loading">Erro ao renderizar PDF: ${err.message}</div>`;
                }).finally(() => {
                    renderTask = null;

                    if (pendingPage !== null) {
                        const nextPendingPage = pendingPage;
                        pendingPage = null;
                        renderPage(nextPendingPage);
                    }
                });
            }

            function goToPage(targetPage) {
                if (!pdfDoc) {
                    return;
                }

                pageNum = Math.min(Math.max(targetPage, 1), pageCount);
                renderPage(pageNum);
            }

            function prevPage() {
                if (pageNum <= 1) {
                    return;
                }

                goToPage(pageNum - 1);
            }

            function nextPage() {
                if (pageNum >= pageCount) {
                    return;
                }

                goToPage(pageNum + 1);
            }

            function zoomIn() {
                userAdjustedZoom = true;
                scale = Math.min(scale + 0.2, 3);
                renderPage(pageNum);
            }

            function zoomOut() {
                userAdjustedZoom = true;
                scale = Math.max(scale - 0.2, 0.3);
                renderPage(pageNum);
            }

            function fitToWidth() {
                if (!pdfDoc) {
                    return;
                }

                pdfDoc.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 1, rotation });
                    scale = Math.min(Math.max((viewer.clientWidth - 48) / viewport.width, 0.3), 3);
                    userAdjustedZoom = true;
                    renderPage(pageNum);
                });
            }

            function fitToHeight() {
                if (!pdfDoc) {
                    return;
                }

                pdfDoc.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 1, rotation });
                    scale = Math.min(Math.max((viewer.clientHeight - 48) / viewport.height, 0.3), 3);
                    userAdjustedZoom = true;
                    renderPage(pageNum);
                });
            }

            function actualSize() {
                scale = 1;
                userAdjustedZoom = true;
                renderPage(pageNum);
            }

            function rotatePage() {
                rotation = (rotation + 90) % 360;
                ajustarEscalaInicial().then(() => renderPage(pageNum));
            }

            function downloadPDF() {
                const link = document.createElement('a');
                link.href = pdfPath;
                link.download = decodeURIComponent(arquivo) || 'apostila.pdf';
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            function toggleAutoPlay() {
                if (autoPlayActive) {
                    clearInterval(autoPlayInterval);
                    autoPlayInterval = null;
                    autoPlayActive = false;
                    playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    playPauseBtn.title = 'Apresentação automática';
                    return;
                }

                if (pageNum >= pageCount) {
                    pageNum = 1;
                }

                autoPlayInterval = setInterval(() => {
                    if (pageNum >= pageCount) {
                        toggleAutoPlay();
                        return;
                    }

                    pageNum += 1;
                    renderPage(pageNum);
                }, 3000);

                autoPlayActive = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playPauseBtn.title = 'Pausar apresentação';
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    viewer.requestFullscreen().catch(err => {
                        console.error('Erro ao entrar em tela cheia:', err);
                    });
                    return;
                }

                document.exitFullscreen().catch(err => {
                    console.error('Erro ao sair da tela cheia:', err);
                });
            }

            function syncFullscreenUi() {
                if (!fullscreenBtn) {
                    return;
                }

                if (document.fullscreenElement) {
                    fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                    fullscreenBtn.title = 'Sair da tela cheia';
                } else {
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                    fullscreenBtn.title = 'Tela cheia';
                }
            }

            function fechar() {
                if (autoPlayActive) {
                    clearInterval(autoPlayInterval);
                    autoPlayInterval = null;
                    autoPlayActive = false;
                }

                if (window.opener && !window.opener.closed) {
                    window.close();

                    setTimeout(() => {
                        if (!window.closed) {
                            window.location.href = 'apostilas.html';
                        }
                    }, 120);
                    return;
                }

                if (window.history.length > 1) {
                    window.history.back();

                    setTimeout(() => {
                        if (document.visibilityState === 'visible') {
                            window.location.href = 'apostilas.html';
                        }
                    }, 180);
                    return;
                }

                window.location.href = 'apostilas.html';
            }

            pageInput.addEventListener('change', event => {
                const newPage = parseInt(event.target.value, 10);

                if (Number.isNaN(newPage)) {
                    pageInput.value = pageNum;
                    return;
                }

                goToPage(newPage);
            });

            viewer.addEventListener('wheel', event => {
                event.preventDefault();

                if (event.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }, { passive: false });

            document.addEventListener('fullscreenchange', syncFullscreenUi);

            window.addEventListener('resize', () => {
                if (!pdfDoc) {
                    return;
                }

                ajustarEscalaInicial().then(() => renderPage(pageNum));
            });

            window.prevPage = prevPage;
            window.nextPage = nextPage;
            window.zoomIn = zoomIn;
            window.zoomOut = zoomOut;
            window.fitToWidth = fitToWidth;
            window.fitToHeight = fitToHeight;
            window.actualSize = actualSize;
            window.rotatePage = rotatePage;
            window.downloadPDF = downloadPDF;
            window.toggleAutoPlay = toggleAutoPlay;
            window.toggleFullscreen = toggleFullscreen;
            window.fechar = fechar;

            if (typeof window.initScrollTopButton === 'function') {
                window.initScrollTopButton({
                    scrollContainer: viewer,
                    threshold: 180
                });
            }

            fetch(pdfPath, { cache: 'no-store' }).then(response => {
                if (!response.ok) {
                    throw new Error(`Resposta inesperada do servidor (${response.status})`);
                }

                return response.arrayBuffer();
            }).then(buffer => {
                return pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
            }).then(pdf => {
                pdfDoc = pdf;
                pageCount = pdf.numPages;
                atualizarPaginaLabel();
                syncFullscreenUi();

                return ajustarEscalaInicial().then(() => renderPage(pageNum));
            }).catch(err => {
                viewer.innerHTML = `<div class="loading">Erro ao carregar PDF: ${err.message}</div>`;
            });
        })();
    </script>
</body>

</html>
