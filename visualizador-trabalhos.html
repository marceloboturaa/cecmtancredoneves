<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/image/colegio-tancredo-almeida-neves_icon 32x32.svg" type="image/svg+xml">
    <title>Visualizador de Trabalhos</title>
    <link rel="stylesheet" href="css/visualizador-trabalhos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header class="toolbar" aria-label="Ferramentas do visualizador">
        <div class="toolbar-title">
            <strong id="document-title">Trabalho</strong>
        </div>

        <div class="toolbar-group">
            <button type="button" class="toolbar-btn toolbar-btn-danger" id="close-btn" aria-label="Fechar">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
            <button type="button" class="toolbar-btn" id="prev-btn" aria-label="Página anterior">
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
            </button>
            <span class="toolbar-text">Página</span>
            <input type="number" id="goto-page" class="toolbar-input" value="1" min="1" aria-label="Ir para página">
            <span class="toolbar-text">de <span id="page-count">?</span></span>
            <button type="button" class="toolbar-btn" id="goto-btn">Ir</button>
            <button type="button" class="toolbar-btn" id="next-btn" aria-label="Próxima página">
                <i class="fas fa-chevron-right" aria-hidden="true"></i>
            </button>
        </div>

        <div class="toolbar-group">
            <button type="button" class="toolbar-btn" id="zoom-out-btn" aria-label="Diminuir zoom">
                <i class="fas fa-search-minus" aria-hidden="true"></i>
            </button>
            <span class="toolbar-chip" id="zoom-level">100%</span>
            <button type="button" class="toolbar-btn" id="zoom-in-btn" aria-label="Aumentar zoom">
                <i class="fas fa-search-plus" aria-hidden="true"></i>
            </button>
            <button type="button" class="toolbar-btn" id="sound-btn" aria-label="Alternar som">
                <i class="fas fa-volume-up" aria-hidden="true"></i>
            </button>
            <button type="button" class="toolbar-btn" id="fullscreen-btn" aria-label="Tela cheia">
                <i class="fas fa-expand" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main id="viewer">
        <div id="viewer-status" class="viewer-status" role="status" aria-live="polite">
            <div class="viewer-status-card">
                <div class="spinner" aria-hidden="true"></div>
                <strong id="viewer-status-title">Carregando trabalho</strong>
                <p id="viewer-status-message">Preparando o visualizador.</p>
            </div>
        </div>

        <section class="viewer-stage">
            <div class="flipbook-shell">
                <button type="button" class="viewer-nav viewer-nav-prev" id="viewer-prev-btn" aria-label="Página anterior">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>

                <div class="flipbook-stage">
                    <div id="sheet-stack" class="sheet-stack">
                        <div class="sheet-slot is-under" id="slot-under"></div>
                        <div class="sheet-slot is-active" id="slot-active"></div>
                    </div>
                    <div class="page-caption" id="page-caption">Página 1 de ?</div>
                </div>

                <button type="button" class="viewer-nav viewer-nav-next" id="viewer-next-btn" aria-label="Próxima página">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
        </section>
    </main>

    <audio id="flip-sound">
        <source src="audio/page-flip.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const arquivo = params.get("file");
            const pasta = params.get("pasta") || "trabalhos";

            const titleElement = document.getElementById("document-title");
            const pageCountElement = document.getElementById("page-count");
            const gotoInput = document.getElementById("goto-page");
            const zoomLabel = document.getElementById("zoom-level");
            const pageCaption = document.getElementById("page-caption");
            const stackElement = document.getElementById("sheet-stack");
            const activeSlot = document.getElementById("slot-active");
            const underSlot = document.getElementById("slot-under");
            const sound = document.getElementById("flip-sound");
            const soundBtn = document.getElementById("sound-btn");
            const status = document.getElementById("viewer-status");
            const statusTitle = document.getElementById("viewer-status-title");
            const statusMessage = document.getElementById("viewer-status-message");

            let pdfDoc = null;
            let totalPages = 0;
            let currentPage = 1;
            let zoom = 1;
            let soundEnabled = false;
            let isAnimating = false;
            let resizeTimer = null;
            const pageCache = new Map();

            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

            function setStatus(title, message, isError) {
                status.hidden = false;
                status.classList.toggle("viewer-status-error", !!isError);
                statusTitle.textContent = title;
                statusMessage.textContent = message;
            }

            function hideStatus() {
                status.hidden = true;
            }

            function formatarTitulo(nomeArquivo) {
                return decodeURIComponent(nomeArquivo)
                    .replace(/\.[^.]+$/, "")
                    .replace(/[-_]+/g, " ")
                    .replace(/\s+/g, " ")
                    .trim()
                    .replace(/\b\w/g, letra => letra.toUpperCase());
            }

            function updateUi() {
                gotoInput.value = currentPage;
                pageCountElement.textContent = totalPages;
                pageCaption.textContent = `Página ${currentPage} de ${totalPages}`;
                zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
                document.documentElement.style.setProperty("--work-zoom", zoom.toFixed(3));

                const isFirst = currentPage <= 1;
                const isLast = currentPage >= totalPages;
                document.getElementById("prev-btn").disabled = isFirst;
                document.getElementById("viewer-prev-btn").disabled = isFirst;
                document.getElementById("next-btn").disabled = isLast;
                document.getElementById("viewer-next-btn").disabled = isLast;
            }

            function playFlipSound() {
                if (!soundEnabled) {
                    return;
                }

                sound.currentTime = 0;
                sound.play().catch(() => { });
            }

            function buildSheet(pageNumber, isPreview) {
                const sheet = document.createElement("div");
                let extraClass = "";

                if (pageNumber === 1) {
                    extraClass = "is-cover";
                } else if (pageNumber === totalPages) {
                    extraClass = "is-ending";
                }

                sheet.className = `sheet-page ${extraClass}`.trim();

                const frame = document.createElement("div");
                frame.className = "page-frame";

                if (pageNumber < 1 || pageNumber > totalPages) {
                    const empty = document.createElement("div");
                    empty.className = "sheet-empty";
                    frame.appendChild(empty);
                } else {
                    const sourceCanvas = pageCache.get(pageNumber);
                    if (sourceCanvas) {
                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");
                        canvas.width = sourceCanvas.width;
                        canvas.height = sourceCanvas.height;
                        context.drawImage(sourceCanvas, 0, 0);
                        frame.appendChild(canvas);
                    } else if (isPreview) {
                        const empty = document.createElement("div");
                        empty.className = "sheet-empty";
                        frame.appendChild(empty);
                    }
                }

                sheet.appendChild(frame);
                return sheet;
            }

            async function renderPdfPage(pageNumber) {
                if (pageCache.has(pageNumber)) {
                    return pageCache.get(pageNumber);
                }

                const pdfPage = await pdfDoc.getPage(pageNumber);
                const viewport = pdfPage.getViewport({ scale: 1.55 });
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await pdfPage.render({
                    canvasContext: context,
                    viewport
                }).promise;

                pageCache.set(pageNumber, canvas);
                return canvas;
            }

            async function ensurePages(pageNumbers) {
                const validPages = pageNumbers.filter(page => page >= 1 && page <= totalPages);
                await Promise.all(validPages.map(page => renderPdfPage(page)));
            }

            function atualizarZoomBase() {
                const stage = document.querySelector(".flipbook-stage");
                const sampleCanvas = pageCache.get(currentPage) || pageCache.get(1);

                if (!stage || !sampleCanvas) {
                    return;
                }

                const stageWidth = Math.max(stage.clientWidth - 52, 220);
                const stageHeight = Math.max(stage.clientHeight - 72, 220);
                const ratio = sampleCanvas.width / sampleCanvas.height;

                let fittedWidth = stageWidth;
                let fittedHeight = fittedWidth / ratio;

                if (fittedHeight > stageHeight) {
                    fittedHeight = stageHeight;
                    fittedWidth = fittedHeight * ratio;
                }

                document.documentElement.style.setProperty("--sheet-width", `${Math.round(fittedWidth)}px`);
                document.documentElement.style.setProperty("--sheet-height", `${Math.round(fittedHeight)}px`);
            }

            async function renderCurrentView() {
                await ensurePages([currentPage, currentPage + 1]);
                atualizarZoomBase();

                activeSlot.innerHTML = "";
                underSlot.innerHTML = "";

                activeSlot.appendChild(buildSheet(currentPage, false));
                underSlot.appendChild(buildSheet(Math.min(currentPage + 1, totalPages), true));

                stackElement.classList.remove("is-flipping-next", "is-flipping-prev");
                updateUi();
            }

            async function goToPage(targetPage, direction) {
                const nextPage = Math.min(Math.max(targetPage, 1), totalPages);

                if (!pdfDoc || nextPage === currentPage || isAnimating) {
                    if (!pdfDoc) {
                        return;
                    }

                    currentPage = nextPage;
                    updateUi();
                    return;
                }

                isAnimating = true;
                await ensurePages([nextPage, nextPage + 1]);

                underSlot.innerHTML = "";
                underSlot.appendChild(buildSheet(nextPage, false));

                stackElement.classList.remove("is-flipping-next", "is-flipping-prev");
                stackElement.offsetWidth;
                stackElement.classList.add(direction === "prev" ? "is-flipping-prev" : "is-flipping-next");
                playFlipSound();

                window.setTimeout(async () => {
                    currentPage = nextPage;
                    await renderCurrentView();
                    isAnimating = false;
                }, 620);
            }

            function previousPage() {
                goToPage(currentPage - 1, "prev");
            }

            function nextPage() {
                goToPage(currentPage + 1, "next");
            }

            function handleGoToPage() {
                const page = parseInt(gotoInput.value, 10);

                if (Number.isNaN(page)) {
                    updateUi();
                    return;
                }

                goToPage(page, page < currentPage ? "prev" : "next");
            }

            function zoomIn() {
                zoom = Math.min(zoom + 0.1, 2.2);
                updateUi();
            }

            function zoomOut() {
                zoom = Math.max(zoom - 0.1, 0.7);
                updateUi();
            }

            function syncSoundButton() {
                sound.muted = !soundEnabled;
                soundBtn.innerHTML = soundEnabled
                    ? '<i class="fas fa-volume-up" aria-hidden="true"></i>'
                    : '<i class="fas fa-volume-mute" aria-hidden="true"></i>';
            }

            function toggleSound() {
                soundEnabled = !soundEnabled;
                syncSoundButton();
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }

            function fechar() {
                if (window.history.length > 1) {
                    window.close();
                    return;
                }

                window.location.href = "trabalhos.html";
            }

            async function carregarDocumento() {
                if (!arquivo) {
                    setStatus("Arquivo não informado", "Selecione um trabalho válido para abrir o visualizador.", true);
                    return;
                }

                const titulo = formatarTitulo(arquivo);
                titleElement.textContent = titulo;
                document.title = `${titulo} | Visualizador de Trabalhos`;

                try {
                    const response = await fetch(`${pasta}/${encodeURIComponent(arquivo)}?v=${Date.now()}`, {
                        cache: "no-store"
                    });

                    if (!response.ok) {
                        throw new Error(`Resposta inesperada do servidor (${response.status})`);
                    }

                    const bytes = new Uint8Array(await response.arrayBuffer());
                    pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
                    totalPages = pdfDoc.numPages;
                    gotoInput.max = totalPages;
                    await renderCurrentView();
                    hideStatus();
                } catch (error) {
                    setStatus("Falha ao carregar", `Não foi possível abrir o trabalho: ${error.message}`, true);
                }
            }

            document.getElementById("close-btn").addEventListener("click", fechar);
            document.getElementById("prev-btn").addEventListener("click", previousPage);
            document.getElementById("next-btn").addEventListener("click", nextPage);
            document.getElementById("goto-btn").addEventListener("click", handleGoToPage);
            document.getElementById("zoom-in-btn").addEventListener("click", zoomIn);
            document.getElementById("zoom-out-btn").addEventListener("click", zoomOut);
            document.getElementById("sound-btn").addEventListener("click", toggleSound);
            document.getElementById("fullscreen-btn").addEventListener("click", toggleFullscreen);
            document.getElementById("viewer-prev-btn").addEventListener("click", previousPage);
            document.getElementById("viewer-next-btn").addEventListener("click", nextPage);

            gotoInput.addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    handleGoToPage();
                }
            });

            document.addEventListener("keydown", event => {
                if (event.target.tagName === "INPUT") {
                    return;
                }

                if (event.key === "ArrowRight" || event.key === "ArrowDown") {
                    nextPage();
                }

                if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
                    previousPage();
                }
            });

            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (pdfDoc) {
                        renderCurrentView();
                    }
                }, 180);
            });

            document.getElementById("viewer").addEventListener("wheel", event => {
                event.preventDefault();

                if (event.ctrlKey) {
                    if (event.deltaY < 0) {
                        zoomIn();
                    } else {
                        zoomOut();
                    }
                } else {
                    if (isAnimating) {
                        return;
                    }

                    if (event.deltaY > 0) {
                        nextPage();
                    } else if (event.deltaY < 0) {
                        previousPage();
                    }
                }
            }, { passive: false });

            updateUi();
            syncSoundButton();
            setStatus("Carregando trabalho", "Preparando o visualizador.", false);
            carregarDocumento();
        })();
    </script>
</body>

</html>
