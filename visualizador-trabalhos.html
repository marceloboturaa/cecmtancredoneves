<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/image/colegio-tancredo-almeida-neves_icon 32x32.svg" type="image/svg+xml">
    <title>Visualizador de Trabalhos</title>
    <link rel="stylesheet" href="css/visualizador-trabalhos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="js/loader.js"></script>
    <script src="js/scroll-helper.js"></script>
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-title">
            <strong id="document-title">Trabalho</strong>
            <span>Modo revista de trabalhos</span>
        </div>

        <button class="close-btn" onclick="fechar()" aria-label="Fechar">
            <i class="fas fa-times"></i>
        </button>
        <button onclick="previousPage()" aria-label="Página anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        <span>Página</span>
        <input type="number" id="goto-page" value="1" min="1" aria-label="Ir para página">
        <span>de <span id="page-count">?</span></span>
        <button onclick="goToPage()">Ir</button>
        <button onclick="nextPage()" aria-label="Próxima página">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button onclick="zoomIn()" aria-label="Aumentar zoom">
            <i class="fas fa-search-plus"></i>
        </button>
        <button onclick="zoomOut()" aria-label="Diminuir zoom">
            <i class="fas fa-search-minus"></i>
        </button>
        <span id="zoom-level">100%</span>
        <button id="sound-btn" onclick="toggleSound()" aria-label="Alternar som">
            <i class="fas fa-volume-up"></i>
        </button>
        <button onclick="toggleFullscreen()" aria-label="Tela cheia">
            <i class="fas fa-expand"></i>
        </button>
    </div>

    <div id="viewer">
        <div id="book-viewport">
            <div id="book">
                <div class="spinner" id="loading-spinner"></div>
            </div>
        </div>
    </div>

    <audio id="flip-sound">
        <source src="assets/audio/page-flip.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const arquivosTrabalhos = [
                "adrana-valentina-2a-inflacao-hiperinflacao.pdf",
                "evelin-santos-2a-inflacao-hiperinflacao.pdf",
                "maria-eduarda-2a-inflacao-hiperinflacao.pdf"
            ];
            const catalogoTrabalhos = Object.fromEntries(
                arquivosTrabalhos.map((nomeArquivo, index) => [`trabalho-${index + 1}`, nomeArquivo])
            );
            const arquivo = catalogoTrabalhos[params.get("id")] || params.get("file");
            const pasta = params.get("pasta") || "trabalhos";

            if (!arquivo) {
                document.body.innerHTML += "<h2>Arquivo não informado</h2>";
                return;
            }

            const cacheKey = Date.now();
            const pdfPath = `${pasta}/${encodeURIComponent(arquivo)}?v=${cacheKey}`;
            const pdfRenderScale = 1.45;

            let pdfDoc = null;
            let pageCount = 0;
            let scale = 1;
            let currentPage = 1;
            let soundEnabled = true;
            let isTurning = false;
            let lastWheelTurn = 0;
            let isPanning = false;
            let panStartX = 0;
            let panStartY = 0;
            let panOriginX = 0;
            let panOriginY = 0;
            let resizeTimer;
            let lastDisplay = window.innerWidth < 600 ? "single" : "double";

            const sound = document.getElementById("flip-sound");
            const soundBtn = document.getElementById("sound-btn");
            const pageCountSpan = document.getElementById("page-count");
            const gotoInput = document.getElementById("goto-page");
            const zoomLevelSpan = document.getElementById("zoom-level");
            const bookViewport = document.getElementById("book-viewport");
            const bookElement = document.getElementById("book");
            const viewer = document.getElementById("viewer");
            const titleElement = document.getElementById("document-title");

            sound.volume = 0.05;

            const dependencies = [
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js",
                "https://code.jquery.com/jquery-3.6.0.min.js",
                "js/turn.min.js"
            ];

            function capitalizar(texto) {
                return texto.charAt(0).toUpperCase() + texto.slice(1);
            }

            function formatarTemaTrabalho(partesTema) {
                return partesTema
                    .map(capitalizar)
                    .join(" ")
                    .replace("Inflacao Hiperinflacao", "Inflação e Hiperinflação")
                    .replace("Inflacao", "Inflação")
                    .replace("Hiperinflacao", "Hiperinflação");
            }

            function formatarTitulo(nomeArquivo) {
                const nomeBase = decodeURIComponent(nomeArquivo)
                    .replace(/\.[^.]+$/, "")
                    .trim();
                const partes = nomeBase.split(/[-_]+/).filter(Boolean);
                const indiceTurma = partes.findIndex(parte => /^\d+[a-z]$/i.test(parte));

                if (indiceTurma === -1) {
                    return "Trabalho de estudante";
                }

                const turma = partes[indiceTurma].toUpperCase();
                const tema = formatarTemaTrabalho(partes.slice(indiceTurma + 1));

                return tema ? `${turma} - ${tema}` : `Trabalho - ${turma}`;
            }

            titleElement.textContent = formatarTitulo(arquivo);
            document.title = `${titleElement.textContent} | Visualizador de Trabalhos`;

            Loader.load(dependencies, iniciarPDF);

            function iniciarPDF() {
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

                fetch(pdfPath, {
                    cache: "no-store"
                }).then(function (response) {
                    if (!response.ok) {
                        throw new Error(`Resposta inesperada do servidor (${response.status})`);
                    }

                    return response.arrayBuffer();
                }).then(function (buffer) {
                    return pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
                }).then(function (pdf) {
                    pdfDoc = pdf;
                    pageCount = pdf.numPages;

                    pageCountSpan.textContent = pageCount;
                    gotoInput.max = pageCount;

                    document.getElementById("loading-spinner").remove();

                    for (let i = 1; i <= pageCount; i++) {
                        const page = document.createElement("div");
                        page.className = "page";
                        page.id = "page-" + i;
                        bookElement.appendChild(page);
                    }

                    renderPage(1);
                    setTimeout(initTurn, 400);
                }).catch(function (error) {
                    viewer.innerHTML = `<div class="page-message viewer-message">Erro ao abrir este trabalho: ${error.message}</div>`;
                });
            }

            function renderPage(num) {
                pdfDoc.getPage(num).then(function (page) {
                    const viewport = page.getViewport({ scale: pdfRenderScale });
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    });
                    document.getElementById("page-" + num).appendChild(canvas);
                });
            }

            function tocarSom() {
                if (!soundEnabled) {
                    return;
                }

                sound.currentTime = 0;
                sound.play().catch(function () { });
            }

            function updateZoomUi() {
                zoomLevelSpan.textContent = Math.round(scale * 100) + "%";
                document.documentElement.style.setProperty("--book-scale", scale.toFixed(2));
                bookElement.classList.toggle("is-zoomed", scale > 1);
                viewer.classList.toggle("is-zoomed", scale > 1);
                viewer.classList.toggle("is-panning", isPanning);
            }

            function startPan(event) {
                if (event.button !== 0 || scale <= 1) {
                    return;
                }

                if (!event.target.closest("#book")) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();
                isPanning = true;
                panStartX = event.clientX;
                panStartY = event.clientY;
                panOriginX = viewer.scrollLeft;
                panOriginY = viewer.scrollTop;
                updateZoomUi();
            }

            function movePan(event) {
                if (!isPanning) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();
                viewer.scrollLeft = panOriginX - (event.clientX - panStartX);
                viewer.scrollTop = panOriginY - (event.clientY - panStartY);
            }

            function endPan() {
                if (!isPanning) {
                    return;
                }

                isPanning = false;
                updateZoomUi();
            }

            function getTurnConfig(display, page) {
                const { largura, altura } = getBookSize();

                return {
                    width: largura,
                    height: altura,
                    autoCenter: true,
                    gradients: true,
                    elevation: 32,
                    display: display,
                    page: page,
                    when: {
                        turning: function (event, nextPage) {
                            isTurning = true;
                            currentPage = nextPage;
                            gotoInput.value = nextPage;
                            tocarSom();
                            lazyLoad(nextPage);
                        },
                        turned: function (event, nextPage) {
                            isTurning = false;
                            currentPage = nextPage;
                            gotoInput.value = nextPage;
                        }
                    }
                };
            }

            function getBookSize() {
                const altura = Math.min(window.innerHeight * 0.85, 900);

                // Ajuste este multiplicador para controlar a proporcao do livro aberto.
                // Aumente este valor para reduzir a sobra branca em cima e embaixo.
                // Diminua este valor se quiser mais altura visual nas folhas.
                const proporcaoLivroAberto = 1.42;

                // Ajuste este limite se quiser permitir um livro mais largo em telas grandes.
                const larguraMaxima = 1080;
                const largura = Math.min(window.innerWidth * 0.86, altura * proporcaoLivroAberto, larguraMaxima);

                return { largura, altura };
            }

            function updateBookViewport() {
                const { largura, altura } = getBookSize();
                bookViewport.style.width = `${Math.round(largura * scale)}px`;
                bookViewport.style.height = `${Math.round(altura * scale)}px`;
            }

            function applyZoom(nextScale) {
                const previousScale = scale;
                const clampedScale = Math.min(Math.max(nextScale, 0.6), 2.4);

                if (clampedScale === scale) {
                    return;
                }

                const centerX = (viewer.scrollLeft + viewer.clientWidth / 2) / previousScale;
                const centerY = (viewer.scrollTop + viewer.clientHeight / 2) / previousScale;

                scale = clampedScale;
                updateBookViewport();
                updateZoomUi();

                requestAnimationFrame(function () {
                    if (scale <= 1) {
                        viewer.scrollLeft = Math.max((bookViewport.scrollWidth - viewer.clientWidth) / 2, 0);
                        viewer.scrollTop = Math.max((bookViewport.scrollHeight - viewer.clientHeight) / 2, 0);
                        return;
                    }

                    viewer.scrollLeft = Math.max(centerX * scale - viewer.clientWidth / 2, 0);
                    viewer.scrollTop = Math.max(centerY * scale - viewer.clientHeight / 2, 0);
                });
            }

            function getVisiblePages() {
                if (!$("#book").data("turn")) {
                    return [currentPage];
                }

                const view = $("#book").turn("view") || [currentPage];
                return view.filter(function (page) {
                    return page >= 1 && page <= pageCount;
                });
            }

            function initTurn() {
                const display = window.innerWidth < 600 ? "single" : "double";

                $("#book").turn(getTurnConfig(display));
                updateBookViewport();

                let touchStartX = 0;
                bookElement.addEventListener("touchstart", function (e) {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                bookElement.addEventListener("touchend", function (e) {
                    const touchEndX = e.changedTouches[0].screenX;
                    const diff = touchEndX - touchStartX;

                    if (Math.abs(diff) > 50) {
                        if (diff < 0) {
                            nextPage();
                        } else {
                            previousPage();
                        }
                    }
                }, { passive: true });
            }

            function recreateBook() {
                if (!$("#book").data("turn")) {
                    return;
                }

                const savedPage = currentPage;

                $("#book").turn("destroy").empty();

                for (let i = 1; i <= pageCount; i++) {
                    const page = document.createElement("div");
                    page.className = "page";
                    page.id = "page-" + i;
                    bookElement.appendChild(page);
                }

                renderPage(savedPage);

                setTimeout(function () {
                    const display = window.innerWidth < 600 ? "single" : "double";
                    $("#book").turn(getTurnConfig(display, savedPage));
                    updateBookViewport();

                    gotoInput.value = savedPage;
                    currentPage = savedPage;
                }, 100);
            }

            window.addEventListener("resize", function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () {
                    if ($("#book").data("turn")) {
                        const currentDisplay = window.innerWidth < 600 ? "single" : "double";

                        if (currentDisplay !== lastDisplay) {
                            lastDisplay = currentDisplay;
                            recreateBook();
                        } else {
                            const { largura: novaLargura, altura: novaAltura } = getBookSize();
                            $("#book").turn("size", novaLargura, novaAltura);
                            updateBookViewport();
                        }
                    }
                }, 200);
            });

            function lazyLoad(page) {
                const pages = [page - 1, page, page + 1];

                pages.forEach(function (p) {
                    if (p >= 1 && p <= pageCount) {
                        const el = document.getElementById("page-" + p);
                        if (el && !el.hasChildNodes()) {
                            renderPage(p);
                        }
                    }
                });
            }

            window.previousPage = function () {
                $("#book").turn("previous");
            };

            window.nextPage = function () {
                $("#book").turn("next");
            };

            window.goToPage = function () {
                let page = parseInt(gotoInput.value, 10);

                if (page < 1) {
                    page = 1;
                }

                if (page > pageCount) {
                    page = pageCount;
                }

                $("#book").turn("page", page);
            };

            window.zoomIn = function () {
                applyZoom(scale + 0.2);
            };

            window.zoomOut = function () {
                applyZoom(scale - 0.2);
            };

            function reloadPages() {
                for (let i = 1; i <= pageCount; i++) {
                    document.getElementById("page-" + i).innerHTML = "";
                }

                const visiblePages = getVisiblePages();
                visiblePages.forEach(function (page) {
                    renderPage(page);
                });

                lazyLoad(currentPage);
            }

            window.toggleFullscreen = function () {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            };

            window.toggleSound = function () {
                soundEnabled = !soundEnabled;
                soundBtn.innerHTML = soundEnabled
                    ? '<i class="fas fa-volume-up"></i>'
                    : '<i class="fas fa-volume-mute"></i>';
            };

            window.fechar = function () {
                if (window.history.length > 1) {
                    window.close();
                    return;
                }

                window.location.href = "trabalhos.html";
            };

            document.addEventListener("keydown", function (e) {
                if (e.target.tagName === "INPUT") {
                    if (e.key === "Enter") {
                        goToPage();
                    }
                    return;
                }

                if (e.key === "ArrowRight") {
                    e.preventDefault();
                    nextPage();
                }

                if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    previousPage();
                }

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    nextPage();
                }

                if (e.key === "ArrowUp") {
                    e.preventDefault();
                    previousPage();
                }

                if (e.key === "+" || e.key === "=" || e.code === "NumpadAdd") {
                    e.preventDefault();
                    zoomIn();
                }

                if (e.key === "-" || e.code === "NumpadSubtract") {
                    e.preventDefault();
                    zoomOut();
                }
            });

            viewer.addEventListener("wheel", function (e) {
                if (isPanning) {
                    return;
                }

                if (e.ctrlKey) {
                    e.preventDefault();

                    if (e.deltaY < 0) {
                        zoomIn();
                    } else {
                        zoomOut();
                    }
                    return;
                }

                e.preventDefault();

                if (isTurning) {
                    return;
                }

                const now = Date.now();
                if (now - lastWheelTurn < 420) {
                    return;
                }

                lastWheelTurn = now;

                if (e.deltaY > 0) {
                    nextPage();
                } else if (e.deltaY < 0) {
                    previousPage();
                }
            }, { passive: false });

            viewer.addEventListener("mousedown", startPan, true);
            window.addEventListener("mousemove", movePan);
            window.addEventListener("mouseup", endPan);
            viewer.addEventListener("mouseleave", endPan);

            if (typeof window.initScrollTopButton === "function") {
                window.initScrollTopButton({
                    scrollContainer: viewer,
                    threshold: 180
                });
            }

            updateZoomUi();
        })();
    </script>
</body>

</html>
